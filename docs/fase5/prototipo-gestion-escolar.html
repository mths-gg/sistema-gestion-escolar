 return note("Horario semanal de demostración para Noveno A.")+'<div class="schedule-days">'+[["Lun","9","4 clases"],["Mar","10","3 clases"],["Mié","11","4 clases"],["Jue","12","3 clases"],["Vie","13","2 clases"]].map(function(d,i){return '<div class="day-card '+(i===0?"current":"")+'"><div class="day">'+d[0]+'</div><strong>'+d[1]+'</strong><small>'+d[2]+'</small></div>'}).join("")+'</div><div class="calendar-list">'+events.map(function(e){return '<div class="calendar-entry"><div class="cal-time">'+e[0]+'<small>Lunes · 9 nov</small></div><div><div class="cal-title">'+e[1]+'</div><div class="cal-desc">'+e[2]+'</div></div><div class="cal-room">'+e[3]+'</div></div>'}).join("")+'</div>';
}
function renderReceipts(){
 return note("Solo consulta de comprobantes. El prototipo no procesa pagos.")+
 head("Comprobantes","Documentos disponibles para consulta.","",null)+
 state.receipts.map(function(r){return '<div class="receipt-card"><div class="receipt-main"><div class="receipt-icon">▣</div><div><strong>'+esc(r.name)+'</strong><small>'+esc(r.period)+' · '+esc(r.date)+' · Ref. '+esc(r.reference)+'</small></div></div><button class="button button-light button-sm" data-action="receipt">Ver comprobante</button></div>'}).join("");
}
function renderPage(){
 switch(state.page){
 case "overview":return dashboard(state.role);
 case "users":return renderUsers();
 case "courses":return renderCourses();
 case "subjects":return renderSubjects();
 case "assignments":return renderAssignments();
 case "schedule":return renderSchedule();
 case "plans":return renderPlans();
 case "observations":return renderObservations();
 case "myCourses":return renderMyCourses();
 case "grades":return renderGrades();
 case "attendance":return renderAttendance();
 case "activities":return renderActivities();
 case "mySubjects":return renderMySubjects();
 case "mySchedule":return head("Mi horario","Consulta las clases programadas para tu curso.","",null)+renderStudentSchedule();
 case "receipts":return renderReceipts();
 default:return dashboard(state.role)
 }
}
function render(){
 document.getElementById("nav-list").innerHTML=navHTML();
 document.getElementById("role-switcher").innerHTML=roleOptions();
 document.getElementById("avatar").textContent=roleInitials[state.role];
 document.getElementById("crumb-current").textContent=navLabel(state.page);
 document.getElementById("main-content").innerHTML=renderPage()+'<div class="footer-note">SIGE Escolar · Prototipo de baja fidelidad funcional · Datos ficticios · Sin conexión a base de datos</div>';
 var globalSearch=document.getElementById("global-search");if(globalSearch)globalSearch.value="";
}
function field(name,label,type,required,options,full,placeholder,min,max,step,help){
 var html='<div class="field '+(full?"full":"")+'"><label for="field-'+name+'">'+label+(required?' <span style="color:#ba5a5c">*</span>':"")+'</label>';
 if(type==="select"){html+='<select id="field-'+name+'" name="'+name+'" '+(required?"required":"")+'><option value="">Selecciona…</option>'+options.map(function(o){return '<option value="'+esc(o.value)+'">'+esc(o.label)+'</option>'}).join("")+'</select>'}
 else if(type==="textarea"){html+='<textarea id="field-'+name+'" name="'+name+'" '+(required?"required":"")+' placeholder="'+esc(placeholder||"")+'"></textarea>'}
 else{html+='<input id="field-'+name+'" name="'+name+'" type="'+type+'" '+(required?"required":"")+(min!=null?' min="'+min+'"':"")+(max!=null?' max="'+max+'"':"")+(step!=null?' step="'+step+'"':"")+' placeholder="'+esc(placeholder||"")+'">'}
 if(help)html+='<small>'+help+'</small>';
 return html+'</div>';
}
function showModal(title,description,type,fields,submit){
 var body=fields.map(function(f){return field(f.name,f.label,f.type||"text",f.required!==false,f.options||[],f.full||false,f.placeholder,f.min,f.max,f.step,f.help)}).join("");
 document.getElementById("modal-root").innerHTML='<div class="modal-backdrop" data-close-modal="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">'+title+'</h2><p>'+description+'</p></div><button class="modal-close" type="button" data-close-modal="true" aria-label="Cerrar">×</button></div><div class="modal-body"><form id="demo-form" data-form-type="'+type+'"><div class="form-grid">'+body+'</div><div class="form-actions"><button type="button" class="button button-light" data-close-modal="true">Cancelar</button><button type="submit" class="button button-primary">'+submit+'</button></div></form></div></section></div>';
 var first=document.querySelector("#demo-form input, #demo-form select");if(first)first.focus();
}
function modalFor(action,index){
 var courseOptions=state.courses.map(function(c){return {value:c.name,label:c.name}}),subjectOptions=state.subjects.map(function(s){return {value:s.name,label:s.name+" · "+s.course}}),teacherOptions=["Lina Rojas","Carlos Méndez","Ana Gómez","Laura Ramírez"].map(function(n){return {value:n,label:n}});
 if(action==="user")showModal("Crear perfil de usuario","Registra una cuenta para uno de los roles disponibles.","user",[
  {name:"name",label:"Nombre completo",placeholder:"Ej. Daniela Martínez"},
  {name:"email",label:"Correo institucional",type:"email",placeholder:"nombre@institucion.edu"},
  {name:"role",label:"Rol",type:"select",options:Object.keys(roleNames).map(function(k){return {value:roleNames[k],label:roleNames[k]}})},
  {name:"status",label:"Estado",type:"select",options:[{value:"Activo",label:"Activo"},{value:"Inactivo",label:"Inactivo"}]}
 ],"Crear perfil");
 if(action==="course")showModal("Crear curso","Añade un curso a la estructura académica.","course",[
  {name:"name",label:"Nombre del curso",placeholder:"Ej. Noveno B"},
  {name:"code",label:"Código",placeholder:"Ej. 9B"},
  {name:"grade",label:"Grado",placeholder:"Ej. 9.º"},
  {name:"students",label:"Cantidad de estudiantes",type:"number",min:0,step:1},
  {name:"lead",label:"Docente referente",type:"select",options:teacherOptions}
 ],"Guardar curso");
 if(action==="subject")showModal("Crear asignatura","Asocia una materia a un curso y un docente.","subject",[
  {name:"name",label:"Nombre de la asignatura",placeholder:"Ej. Física"},
  {name:"code",label:"Código",placeholder:"Ej. FIS-09"},
  {name:"course",label:"Curso",type:"select",options:courseOptions},
  {name:"teacher",label:"Docente",type:"select",options:teacherOptions},
  {name:"period",label:"Periodo",type:"select",options:[1,2,3,4].map(function(n){return {value:"Periodo "+n,label:"Periodo "+n}})}
 ],"Guardar asignatura");
 if(action==="assignment")showModal("Asignar docente","Vincula docente, asignatura y curso.","assignment",[
  {name:"teacher",label:"Docente",type:"select",options:teacherOptions},
  {name:"subject",label:"Asignatura",type:"select",options:subjectOptions},
  {name:"course",label:"Curso",type:"select",options:courseOptions},
  {name:"schedule",label:"Referencia de horario",placeholder:"Ej. Lun · 08:00"}
 ],"Guardar asignación");
 if(action==="schedule")showModal("Asignar horario","El prototipo comprueba cruces para el mismo docente.","schedule",[
  {name:"teacher",label:"Docente",type:"select",options:teacherOptions},
  {name:"subject",label:"Asignatura",type:"select",options:subjectOptions},
  {name:"course",label:"Curso",type:"select",options:courseOptions},
  {name:"day",label:"Día",type:"select",options:["Lun","Mar","Mié","Jue","Vie"].map(function(d){return {value:d,label:d}})},
  {name:"time",label:"Hora de inicio",type:"time"},
  {name:"room",label:"Espacio",placeholder:"Ej. Aula 204"}
 ],"Guardar horario");
 if(action==="grade")showModal("Registrar calificación","Cada nota debe incluir retroalimentación para el estudiante.","grade",[
  {name:"student",label:"Estudiante",type:"select",options:["Valentina Pérez","Mateo Silva","Lucía Rojas","Samuel Ortiz"].map(function(n){return {value:n,label:n}})},
  {name:"subject",label:"Asignatura",type:"select",options:subjectOptions},
  {name:"activity",label:"Actividad",type:"select",options:state.activities.map(function(a){return {value:a.name,label:a.name}})},
  {name:"score",label:"Calificación (0 a 5)",type:"number",min:0,max:5,step:.1},
  {name:"feedback",label:"Retroalimentación",type:"textarea",full:true,placeholder:"Describe qué logró y qué puede mejorar."}
 ],"Guardar calificación");
 if(action==="attendance")showModal("Registrar asistencia","Marca el estado de cada estudiante en una sesión.","attendance",[
  {name:"student",label:"Estudiante",type:"select",options:["Valentina Pérez","Mateo Silva","Lucía Rojas","Samuel Ortiz"].map(function(n){return {value:n,label:n}})},
  {name:"course",label:"Curso",type:"select",options:courseOptions},
  {name:"status",label:"Estado",type:"select",options:["Presente","Ausente","Tarde"].map(function(n){return {value:n,label:n}})},
  {name:"note",label:"Observación o justificación",type:"textarea",required:false,full:true,placeholder:"Opcional"}
 ],"Guardar asistencia");
 if(action==="activity")showModal("Registrar actividad","Vincula una actividad al curso y al plan del periodo.","activity",[
  {name:"name",label:"Nombre de la actividad",placeholder:"Ej. Exposición de ciencias"},
  {name:"subject",label:"Asignatura",type:"select",options:subjectOptions},
  {name:"course",label:"Curso",type:"select",options:courseOptions},
  {name:"due",label:"Fecha de entrega",type:"date"},
  {name:"status",label:"Estado",type:"select",options:[{value:"Programada",label:"Programada"},{value:"En curso",label:"En curso"}]}
 ],"Guardar actividad");
 if(action==="observation")showModal("Registrar observación","Añade una observación general o asociada a una asignatura.","observation",[
  {name:"student",label:"Estudiante",type:"select",options:["Valentina Pérez","Mateo Silva","Lucía Rojas","Samuel Ortiz"].map(function(n){return {value:n,label:n}})},
  {name:"course",label:"Curso",type:"select",options:courseOptions},
  {name:"subject",label:"Asignatura (opcional)",type:"select",required:false,options:subjectOptions},
  {name:"text",label:"Observación",type:"textarea",full:true,placeholder:"Registra una observación concreta y respetuosa."}
 ],"Guardar observación");
 if(action==="edit-observation"){
  var o=state.observations[index];if(!o)return;
  showModal("Modificar observación","La edición de observaciones está disponible para coordinación.","edit-observation",[
   {name:"text",label:"Observación",type:"textarea",full:true,placeholder:o.text}
  ],"Guardar cambios");
  var input=document.querySelector('[name="text"]');if(input)input.value=o.text;
  document.getElementById("demo-form").dataset.index=index;
 }
 if(action==="edit-plan"){
  var fields=state.plan.map(function(item,i){return {name:"weight"+i,label:item.name+" · ponderación (%)",type:"number",min:0,max:100,step:1,placeholder:String(item.weight),help:"Suma actual de ejemplo: "+state.plan.reduce(function(sum,x){return sum+Number(x.weight||0)},0)+"%"}});
  showModal("Editar plan del periodo","Ajusta las ponderaciones. La suma debe ser exactamente 100%.","plan",fields,"Guardar plan");
  state.plan.forEach(function(item,i){var el=document.querySelector('[name="weight'+i+'"]');if(el)el.value=item.weight});
 }
 if(action==="course-detail"){
  var c=state.courses[index];if(!c)return;
  showModal(c.name+" · "+c.grade,"Resumen de curso · Datos ficticios","",[
   {name:"detail1",label:"Estudiantes",type:"text",required:false,placeholder:String(c.students)},
   {name:"detail2",label:"Asignaturas",type:"text",required:false,placeholder:String(c.subjects)},
   {name:"detail3",label:"Docente referente",type:"text",required:false,placeholder:c.lead},
   {name:"detail4",label:"Código",type:"text",required:false,placeholder:c.code}
  ],"Cerrar");
  var form=document.getElementById("demo-form");if(form){form.querySelectorAll("input").forEach(function(el){el.readOnly=true;el.value=el.placeholder});form.querySelector('button[type="submit"]').textContent="Listo";form.dataset.formType="readonly"}
 }
 if(action==="subject-detail"||action==="edit-assignment"||action==="activity-detail"||action==="receipt"){
  var messages={ "subject-detail":"Detalle de asignatura disponible en esta vista de demostración.","edit-assignment":"Asignación docente de ejemplo; sin conexión con base de datos.","activity-detail":"Detalle de actividad de demostración.","receipt":"Comprobante de ejemplo disponible solo para consulta."};
  notify(messages[action]||"Acción de demostración.");
 }
 if(action==="edit-user"){
  var user=state.users[index];if(user)notify(user.name+" · "+user.role+" · "+user.email);
 }
}
function notify(message){
 var root=document.getElementById("toast-root");
 root.innerHTML='<div class="toast"><span class="toast-icon">✓</span><span>'+esc(message)+'</span></div>';
 window.clearTimeout(notify.timer);notify.timer=window.setTimeout(function(){root.innerHTML=""},3200);
}
function formSubmit(form){
 var data=new FormData(form),v={};data.forEach(function(value,key){v[key]=String(value).trim()});
 var type=form.dataset.formType;
 if(type==="plan"){
  var total=state.plan.reduce(function(sum,item,i){return sum+Number(v["weight"+i]||0)},0);
  if(total!==100){notify("La suma de las ponderaciones debe ser 100%. Actualmente es "+total+"%.");return}
  state.plan=state.plan.map(function(item,i){return {name:item.name,weight:Number(v["weight"+i])}});
  closeModal();render();notify("Plan de estudio actualizado.");
  return;
 }
 if(type==="schedule"){
  var newSlot=v.day+" · "+v.time.slice(0,5),conflict=state.assignments.some(function(a){return a.teacher===v.teacher&&a.schedule===newSlot});
  if(conflict){notify("Conflicto: ese docente ya tiene una asignación en el mismo horario.");return}
  state.assignments.unshift({teacher:v.teacher,subject:v.subject,course:v.course,schedule:newSlot,room:v.room});
  closeModal();render();notify("Horario guardado. No se encontró cruce para este docente.");return;
 }
 if(type==="edit-observation"){
  var i=Number(form.dataset.index);if(state.observations[i])state.observations[i].text=v.text;
  closeModal();render();notify("Observación modificada por coordinación.");return;
 }
 if(type==="user"){state.users.unshift({name:v.name,email:v.email,role:v.role,status:v.status})}
 if(type==="course"){state.courses.unshift({name:v.name,code:v.code,grade:v.grade,students:Number(v.students),lead:v.lead,subjects:0})}
 if(type==="subject"){state.subjects.unshift({name:v.name,code:v.code,course:v.course,teacher:v.teacher,period:v.period})}
 if(type==="assignment"){state.assignments.unshift({teacher:v.teacher,subject:v.subject,course:v.course,schedule:v.schedule})}
 if(type==="grade"){
  if(!v.feedback){notify("La retroalimentación es obligatoria para guardar una calificación.");return}
  state.grades.unshift({student:v.student,subject:v.subject,activity:v.activity,score:Number(v.score).toFixed(1),feedback:v.feedback,date:"09 nov 2026"})
 }
 if(type==="attendance"){state.attendance.unshift({student:v.student,course:v.course,date:"09 nov 2026",status:v.status,note:v.note})}
 if(type==="activity"){state.activities.unshift({name:v.name,subject:v.subject,course:v.course,due:v.due,status:v.status})}
 if(type==="observation"){state.observations.unshift({student:v.student,course:v.course,subject:v.subject,text:v.text,author:rolePeople[state.role],date:"09 nov 2026"})}
 closeModal();render();notify(({user:"Perfil creado.",course:"Curso guardado.",subject:"Asignatura guardada.",assignment:"Asignación guardada.",grade:"Calificación guardada con retroalimentación.",attendance:"Asistencia guardada.",activity:"Actividad registrada.",observation:"Observación registrada."})[type]||"Cambios guardados.");
}
function closeModal(){document.getElementById("modal-root").innerHTML=""}
document.addEventListener("click",function(e){
 var page=e.target.closest("[data-page]");if(page){e.preventDefault();changePage(page.dataset.page);return}
 var action=e.target.closest("[data-action]");if(action){e.preventDefault();modalFor(action.dataset.action,Number(action.dataset.index));return}
 if(e.target.closest("[data-close-modal]")&&e.target.closest(".modal-backdrop")){closeModal();return}
});
document.addEventListener("submit",function(e){if(e.target&&e.target.id==="demo-form"){e.preventDefault();if(e.target.dataset.formType!=="readonly")formSubmit(e.target);else closeModal()}});
document.getElementById("role-switcher").addEventListener("change",function(e){setRole(e.target.value)});
document.getElementById("mobile-toggle").addEventListener("click",function(){document.getElementById("sidebar").classList.toggle("open")});
document.addEventListener("input",function(e){
 if(e.target.classList.contains("filter-input")){var q=e.target.value.toLowerCase();document.querySelectorAll("tbody tr").forEach(function(row){row.style.display=row.dataset.search.indexOf(q)>=0?"":"none"})}
 if(e.target.id==="global-search"){var q=e.target.value.toLowerCase();document.querySelectorAll("tbody tr").forEach(function(row){row.style.display=row.dataset.search.indexOf(q)>=0?"":"none"})}
});
render();
})();
</script>
</body>
